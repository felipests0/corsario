<section class="dashboard">
    <div class="dashboard-header">
        <h2>A Minha Cabine</h2>
    </div>

    <div class="catalog-card" style="max-width: 600px;">
        <h3>Oficial: {{.Username}} <span class="badge-status">{{.Realm}}</span></h3>
        <p class="hub-desc">
            Proteja a ponte de comando ativando a Autenticação de Dois Fatores (2FA / TOTP) compatível com Google Authenticator, Authy ou FreeOTP.
        </p>

        {{if .TOTPEnabled}}
        <div class="launch-success-box" style="margin-bottom: 1rem;">
            <span>🔐 2FA já se encontra ativo nesta conta.</span>
        </div>
        {{end}}

        <button type="button" class="btn-gold" hx-post="/profile/2fa/generate" hx-target="#2fa-setup" hx-swap="innerHTML">
            Ativar 2FA
        </button>
        <div id="2fa-setup" style="margin-top: 20px;"></div>
    </div>
</section>
