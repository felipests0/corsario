<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corsário</title>
    <link rel="icon" type="image/jpeg" href="/static/img/logocorsario.jpeg">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        (function () {
            function normalizeNumericIdSelector(sel) {
                if (typeof sel === "string" && /^#[0-9]/.test(sel)) {
                    return '[id="' + sel.slice(1).replace(/"/g, '\\"') + '"]';
                }
                return sel;
            }
            const origDocQS = Document.prototype.querySelector;
            const origDocQSA = Document.prototype.querySelectorAll;
            const origEltQS = Element.prototype.querySelector;
            const origEltQSA = Element.prototype.querySelectorAll;
            Document.prototype.querySelector = function (sel) {
                return origDocQS.call(this, normalizeNumericIdSelector(sel));
            };
            Document.prototype.querySelectorAll = function (sel) {
                return origDocQSA.call(this, normalizeNumericIdSelector(sel));
            };
            Element.prototype.querySelector = function (sel) {
                return origEltQS.call(this, normalizeNumericIdSelector(sel));
            };
            Element.prototype.querySelectorAll = function (sel) {
                return origEltQSA.call(this, normalizeNumericIdSelector(sel));
            };
        })();
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
</head>
<body>
    <div id="ocean-lights">
        <div class="light-streak streak-1"></div>
        <div class="light-streak streak-2"></div>
        <div class="light-streak streak-3"></div>
    </div>
    <header>
        <img src="/static/img/logocorsario.jpeg" id="navio-logo" alt="Corsário Logo">
        <h1>Corsário</h1>
        <nav class="nav-tabs">
            <button type="button" class="nav-tab" hx-get="/containers" hx-target="#conteudo-principal">
                Frota
            </button>
            <button type="button" class="nav-tab" hx-get="/images" hx-target="#conteudo-principal">
                Arsenal
            </button>
            <button type="button" class="nav-tab" hx-get="/catalog" hx-target="#conteudo-principal">
                Estaleiro
            </button>
            <button type="button" class="nav-tab" hx-get="/users" hx-target="#conteudo-principal">
                Tripulação
            </button>
            <button type="button" class="nav-tab" hx-get="/profile" hx-target="#conteudo-principal">
                A Minha Cabine
            </button>
        </nav>
    </header>
    <main id="conteudo-principal" class="container">
        {{template "dashboard" .}}
    </main>

    <script>
        window.addEventListener("scroll", function () {
            const scrollable = document.body.scrollHeight - window.innerHeight;
            const scrollPercent = scrollable > 0 ? window.scrollY / scrollable : 0;
            const navio = document.getElementById("navio-logo");
            if (navio) {
                const moveX = scrollPercent * 100;
                const tiltDeg = Math.sin(window.scrollY * 0.05) * 5;
                navio.style.transform = "translateX(" + moveX + "px) rotate(" + tiltDeg + "deg)";
            }
        });

        document.addEventListener("mousemove", function (e) {
            document.body.style.setProperty('--mouse-x', e.clientX + 'px');
            document.body.style.setProperty('--mouse-y', e.clientY + 'px');
        });
    </script>
</body>
</html>
