<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corsário</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
</head>
<body>
    <header>
        <div class="brand-header">
            <img src="/static/img/logocorsario.jpeg" id="navio-logo" alt="Corsário Logo">
            <h1>Corsário</h1>
        </div>
        <nav class="nav-tabs">
            <button type="button" class="nav-tab" hx-get="/containers" hx-target="#conteudo-principal">
                Frota
            </button>
            <button type="button" class="nav-tab" hx-get="/images" hx-target="#conteudo-principal">
                Arsenal
            </button>
            <button type="button" class="nav-tab" hx-get="/catalog" hx-target="#conteudo-principal">
                Estaleiro
            </button>
        </nav>
    </header>
    <main id="conteudo-principal" class="container">
        {{template "dashboard" .}}
    </main>

    <script>
        window.addEventListener("scroll", function () {
            const scrollable = document.body.scrollHeight - window.innerHeight;
            const scrollPercent = scrollable > 0 ? window.scrollY / scrollable : 0;
            const navio = document.getElementById("navio-logo");
            if (navio) {
                const moveX = scrollPercent * 100;
                const tiltDeg = Math.sin(window.scrollY * 0.05) * 5;
                navio.style.transform = "translateX(" + moveX + "px) rotate(" + tiltDeg + "deg)";
            }
        });
    </script>
</body>
</html>
